# Verified Curve pool registry.
#
# Every pool listed here with `fuzz_verified = true` has passed differential
# fuzz testing against its on-chain `get_dy` with 100+ random swap amounts
# (including edge cases: 0, 1 wei, 0.1%/10%/50%/100%/200% of balance, MAX).
#
# To run verification:
#   FUZZ_ITERATIONS=100 RPC_URL=<rpc> cargo test --features swap --test fuzz_registry -- --ignored --nocapture
#
# Fields:
#   address          - Pool contract address (checksummed)
#   chain            - Chain name (matches RPC_URL env var: RPC_URL_ETHEREUM, RPC_URL_ARBITRUM, etc.)
#   variant          - One of: StableSwapV0, StableSwapV1, StableSwapV2, StableSwapALend,
#                      StableSwapNG, StableSwapMeta, TwoCryptoV1, TwoCryptoNG, TriCryptoV1, TriCryptoNG
#   name             - Human-readable pool name
#   coins            - Number of coins (2, 3, or 4)
#   decimals         - Token decimals array
#   fuzz_verified    - Whether this pool passes differential fuzz
#   note             - Optional notes

# ═══════════════════════════════════════════════════════════════════════════════
