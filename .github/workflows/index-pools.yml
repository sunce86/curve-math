name: Index Pools

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 6am UTC
  workflow_dispatch:       # Manual trigger

jobs:
  index:
    name: Discover & Verify Pools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: pip install web3 toml

      - name: Run pool indexer
        env:
          RPC_URL_1: ${{ secrets.RPC_URL_1 }}
        run: |
          if [ -z "$RPC_URL_1" ]; then
            echo "::warning::RPC_URL_1 not set, skipping"
            exit 0
          fi
          python tools/index-pools.py --chain-id 1 --min-tvl 1000000 --max-new 10

      - name: Create PR if changes
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "Update pool registry (auto-indexed)"
          title: "Update pool registry"
          body: |
            Auto-generated by [index-pools workflow](https://github.com/${{ github.repository }}/actions/workflows/index-pools.yml).

            New pools discovered and fuzz-verified against on-chain `get_dy`.
          branch: auto/index-pools
          delete-branch: true
